      </div>`).join("") + `</div>`;
  }
  $("wrap").innerHTML = h;
}

/* ============================================================
   Events
   ============================================================ */
function strikeVal(id){
  const el = document.querySelector(`[data-strike="${id}"]`);
  const v = el ? num(el.value,0) : 0;
  if(el) el.value = "";
  return v;
}
function wire(){
  document.body.addEventListener("click", e=>{
    const t = e.target;

    /* chrome */
    const vt = t.closest("[data-view]"); if(vt){ S.view = vt.dataset.view; ui.pendingDel=null; renderAll(); return; }
    if(t.closest("#btnExport")){ exportJSON(); return; }
    if(t.closest("#btnImport")){ $("fileImport").click(); return; }
    if(t.closest("#btnPrint")){ try{ window.print(); }catch(err){ toast("Printing is blocked here — use the downloaded file","err"); } return; }
    if(t.closest("#btnRest")){ resetVitals(); return; }
    if(t.closest("#btnClearFoes")){ clearFoes(); return; }

    /* combat bar */
    if(t.closest("#btnStart")){ startEncounter(); return; }
    if(t.closest("#btnNext") || t.closest("#footNext")){ nextTurn(); return; }
    if(t.closest("#btnPrev") || t.closest("#footPrev")){ prevTurn(); return; }
    if(t.closest("#btnEnd")){ endEncounter(); return; }
    if(t.closest("#btnSort")){ captureLine(); sortCs(); renderQueue(); toast("Re-sorted by initiative"); return; }
    if(t.closest("#btnRoll")){ const n=rollInit(true); renderAll(); toast(n?`Initiative rolled for ${n}`:"Everyone already has initiative"); return; }

    /* picker */
    if(t.closest("#btnOpenPick")){ ui.pick=true; renderAll(); return; }
    if(t.closest("#btnClosePick")){ ui.pick=false; renderAll(); return; }
    const pt = t.closest("[data-ptab]"); if(pt){ ui.tab=pt.dataset.ptab; renderAll(); return; }
    const ps = t.closest("[data-pside]"); if(ps){ ui.side=ps.dataset.pside; renderAll(); return; }
    const ad = t.closest("[data-add]"); if(ad){ addTemplate(+ad.dataset.add, ui.qty, ui.side); return; }
    const apc = t.closest("[data-addpc]"); if(apc){ addPartyMember(apc.dataset.addpc); return; }
    if(t.closest("#btnAddAllPC") || t.closest("#btnAddAllPC2")){ addWholeParty(); return; }
    if(t.closest("#btnAddCustom")){ addCustom(); return; }

    /* rows */
    const op = t.closest("[data-open]"); if(op){ const id=op.dataset.open; ui.open[id]=!ui.open[id]; renderAll(); return; }
    const ro = t.closest("[data-rollone]"); if(ro){
      const c = byId(ro.dataset.rollone); if(!c) return;
      const die = d20(); c.init = die + c.initMod; sortCs();
      flashRoll(c.init, `${c.name} — d20 ${die} ${sgn(c.initMod)}`);
      renderAll(); return;
    }
    const st = t.closest("[data-setturn]"); if(st){ captureLine(); S.activeId = st.dataset.setturn; renderQueue(); return; }
    const dl = t.closest("[data-del]"); if(dl){ ui.pendingDel = dl.dataset.del; renderAll(); return; }
    const dy = t.closest("[data-delyes]"); if(dy){ ui.pendingDel=null; removeCombatant(dy.dataset.delyes); return; }
    if(t.closest("[data-delno]")){ ui.pendingDel=null; renderAll(); return; }

    const aj = t.closest("[data-adj]"); if(aj){
      const [id,key,d] = aj.dataset.adj.split("|");
      adjustPool(id, key, +d); renderAll(); return;
    }
    const hb = t.closest("[data-hit]"); if(hb){
      const [id,kind] = hb.dataset.hit.split("|");
      const v = strikeVal(id);
      if(!v){ toast("Type an amount in the box first","err"); return; }
      if(kind==="dmg") damage(id,v); else if(kind==="heal") heal(id,v); else grantTemp(id,v);
      renderAll(); return;
    }
    const uc = t.closest("[data-uncond]"); if(uc){
      const [id,i] = uc.dataset.uncond.split("|");
      const c = byId(id); if(c){ c.cond.splice(+i,1); renderAll(); }
      return;
    }
    const cd = t.closest("[data-cond]"); if(cd){
      const [id,name] = cd.dataset.cond.split("|");
      const c = byId(id); if(!c) return;
      const at = c.cond.findIndex(x=>x.n===name);
      if(at>-1){ c.cond.splice(at,1); logit(`<b>${esc(c.name)}</b> — ${esc(name)} ends.`,""); }
      else { c.cond.push({n:name, r:null}); logit(`<b>${esc(c.name)}</b> is ${esc(name)}.`,""); }
      renderAll(); return;
    }
    const ca = t.closest("[data-condadd]"); if(ca){
      const id = ca.dataset.condadd, c = byId(id); if(!c) return;
      const nEl = document.querySelector(`[data-condfree="${id}"]`), rEl = document.querySelector(`[data-condr="${id}"]`);
      const name = nEl ? nEl.value.trim() : "";
      if(!name){ toast("Name the condition first","err"); return; }
      const r = rEl && rEl.value.trim() ? Math.max(1,num(rEl.value,1)) : null;
      c.cond.push({n:name, r});
      logit(`<b>${esc(c.name)}</b> is ${esc(name)}${r?` (${r} rounds)`:""}.`,"");
      renderAll(); return;
    }
    const ao = t.closest("[data-atkopen]"); if(ao){
      const p = ao.dataset.atkopen.split("|");
      openAtkPanel(p[0], +p[1]); return;
    }
    const atg = t.closest("[data-atktgt]"); if(atg){
      if(ui.atk){ ui.atk.target = atg.dataset.atktgt || null; ui.atk.result = null; renderAll(); }
      return;
    }
    if(t.closest("[data-atkroll]")){ resolveAttack(); return; }
    if(t.closest("[data-atkapply]")){ applyAttack(); return; }
    if(t.closest("[data-atkclose]")){ ui.atk = null; renderAll(); return; }

    /* party */
    if(t.closest("#btnNewPC")){ newPartyMember(); return; }
    if(t.closest("#btnPickChar") || t.closest("#drop")){ $("fileChar").click(); return; }
    const dp = t.closest("[data-delpc]"); if(dp){ removeParty(dp.dataset.delpc); return; }
    const sp = t.closest("[data-sendpc]"); if(sp){ S.view="encounter"; addPartyMember(sp.dataset.sendpc); return; }

    /* log */
    if(t.closest("#btnCopyLog")){ copyLog(); return; }
    if(t.closest("#btnClearLog")){ S.log=[]; renderAll(); return; }
  });

  /* live typing — never re-renders, so focus is never stolen */
  document.body.addEventListener("input", e=>{
    const t = e.target;
    const nm = t.dataset.name; if(nm!==undefined){ const c=byId(nm); if(c){ c.name=t.value; save(); } return; }
    const ac = t.dataset.ac;   if(ac!==undefined){ const c=byId(ac); if(c){ c.ac=num(t.value,c.ac); save(); } return; }
    const pv = t.dataset.pv;   if(pv!==undefined){
      const [id,key]=pv.split("|"); const c=byId(id); if(c && c[key]){ c[key].c=clamp(num(t.value,0),0,c[key].m); save(); syncBar(c,key); }
      return;
    }
    const cu = t.dataset.cu;   if(cu!==undefined){ ui.custom[cu]= (cu==="name"||cu==="g"||cu==="side") ? t.value : num(t.value,0); return; }
    const nt = t.dataset.note; if(nt!==undefined){ const c=byId(nt); if(c){ c.note=t.value; save(); } return; }
    if(t.dataset.atkbonus!==undefined && ui.atk){ ui.atk.bonus = num(t.value,0); return; }
    if(t.dataset.atkrider!==undefined && ui.atk){
      ui.atk.rider = t.value;
      const c = byId(ui.atk.cid); if(c){ c.bonusDice = t.value; save(); }   // sticks to the creature
      return;
    }
    const bd = t.dataset.bonusdice; if(bd!==undefined){ const c=byId(bd); if(c){ c.bonusDice=t.value; save(); } return; }
    if(t.id==="pkQ"){ ui.q=t.value; const box=document.querySelector(".results"); if(box) refreshResults(box); return; }
    if(t.id==="pkQty"){ ui.qty=clamp(num(t.value,1),1,20); return; }
    const pf = t.dataset.pcf;  if(pf!==undefined){
      const [id,key]=pf.split("|"); const p=S.party.find(x=>x.id===id);
      if(p){ p[key] = (key==="name") ? t.value : num(t.value,0); save(); }
      return;
    }
  });

  /* commit-style edits — these re-render */
  document.body.addEventListener("change", e=>{
    const t = e.target;
    const ini = t.dataset.init; if(ini!==undefined){
      const c=byId(ini); if(c){ c.init = t.value.trim()==="" ? null : num(t.value,0); sortCs(); renderAll(); }
      return;
    }
    const mx = t.dataset.max; if(mx!==undefined){
      const [id,key]=mx.split("|"); const c=byId(id); if(!c) return;
      if(key==="thp") c.thp=Math.max(0,num(t.value,0));
      else { c[key].m=Math.max(0,num(t.value,0)); c[key].c=clamp(c[key].c,0,c[key].m); }
      renderAll(); return;
    }
    const im = t.dataset.initmod; if(im!==undefined){ const c=byId(im); if(c){ c.initMod=num(t.value,0); renderAll(); } return; }
    const sd = t.dataset.side;    if(sd!==undefined){ const c=byId(sd); if(c){ c.side=t.value; renderAll(); } return; }
    if(t.id==="pkSec"){ ui.sec=t.value; renderAll(); return; }
    if(t.id==="fileImport" && t.files[0]){ importJSON(t.files[0]); t.value=""; return; }
    if(t.id==="fileChar" && t.files.length){ importCharFiles(t.files); t.value=""; return; }
    if(t.dataset.cu==="side"){ ui.custom.side=t.value; return; }
  });

  /* keyboard: Enter in the strike box applies damage; arrows drive turns */
  document.body.addEventListener("keydown", e=>{
    const t = e.target;
    if(t.dataset && t.dataset.strike!==undefined && e.key==="Enter"){
      e.preventDefault();
      const v = strikeVal(t.dataset.strike);
      if(v) { damage(t.dataset.strike, v); renderAll(); }
      return;
    }
    if(t.dataset && t.dataset.init!==undefined && e.key==="Enter"){ t.blur(); return; }
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if(!S.started) return;
    if(e.key==="ArrowRight" || e.key===" "){ e.preventDefault(); nextTurn(); }
    else if(e.key==="ArrowLeft"){ e.preventDefault(); prevTurn(); }
  });

  /* drag & drop character exports anywhere on the Party view */
  ["dragenter","dragover"].forEach(ev=>document.body.addEventListener(ev, e=>{
    if(S.view!=="party") return;
    e.preventDefault(); const dz=$("drop"); if(dz) dz.classList.add("hot");
  }));
  ["dragleave","drop"].forEach(ev=>document.body.addEventListener(ev, e=>{
    const dz=$("drop"); if(dz && ev==="dragleave" && e.target===dz) dz.classList.remove("hot");
    if(ev==="drop"){
      if(S.view!=="party") return;
      e.preventDefault(); if(dz) dz.classList.remove("hot");
      if(e.dataTransfer && e.dataTransfer.files.length) importCharFiles(e.dataTransfer.files);
    }
  }));
}
function syncBar(c, key){
  const row = $("cmb-"+c.id); if(!row) return;
  const pool = row.querySelector(`.pool.${key} .bar i`); if(!pool) return;
  pool.style.width = (c[key].m>0 ? clamp(Math.round(c[key].c/c[key].m*100),0,100) : 0) + "%";
}
function refreshResults(box){
  const list = filteredBestiary();
  box.innerHTML = list.length ? list.map(({b,i})=>`<button class="res" data-add="${i}">
      <span class="rg">${esc(b.g)}</span>
      <span class="rmain"><span class="rn">${esc(b.n)}</span><span class="rm">${esc(b.race)} · ${b.lv?("lv "+b.lv):("CR "+b.cr)}</span></span>
      <span class="rstat"><span class="a">AC ${b.ac}</span><span class="h">${b.hp} hp</span></span>
    </button>`).join("") : `<div class="empty" style="grid-column:1/-1"><p>Nothing on the shelves matches that.</p></div>`;
}


/* ============================================================
   Dice Roller — ported from the Character Builder
   Same engine: decelerating tick schedule, crit payoff, saved
   favourites. Here it also drives the attack buttons on a
   combatant's sheet, and named rolls land in the combat log.
   ============================================================ */
const DICE_TYPES = [4,6,8,10,12,20,100];
const DIE_GLYPH = {4:"▲",6:"◼",8:"◆",10:"◈",12:"⬠",20:"⬡",100:"✺"};
let diceQty = 1, diceMod = 0, diceOpen = false, diceLog = [], rollLabel = "";

function diceToggle(open){
  diceOpen = (open==null) ? !diceOpen : open;
  $("diceTray").classList.toggle("on", diceOpen);
  $("diceTray").setAttribute("aria-hidden", String(!diceOpen));
  $("diceOverlay").classList.toggle("on", diceOpen);
  $("diceFab").classList.toggle("spin", diceOpen);
}
function renderDicePicker(){
  $("dicePicker").innerHTML = DICE_TYPES.map(s=>
    `<button class="die-btn" data-die="${s}" title="Roll ${diceQty}d${s}${diceMod?(diceMod>0?" + "+diceMod:" − "+Math.abs(diceMod)):""}"><span class="db-shape">${DIE_GLYPH[s]}</span><span class="db-lbl">d${s}</span></button>`).join("");
}
function updateDiceOpts(){
  $("diceQtyN").textContent = diceQty;
  $("diceModN").textContent = (diceMod>=0?"+":"−") + Math.abs(diceMod);
  renderDicePicker();
}
const rollDie = sides => 1 + Math.floor(Math.random()*sides);
let diceRolling = false, lastRoll = null;
/* Decelerating face-change schedule (ms) — fast blur → slow suspense → settle. ~1.8s total. */
const DICE_TICKS = [50,52,56,62,72,84,100,120,148,184,230,290,360];

function rollDice(sides){
  if(diceRolling) return;                          // ignore new rolls mid-animation
  const rolls = []; for(let i=0;i<diceQty;i++) rolls.push(rollDie(sides));
  const total = rolls.reduce((x,y)=>x+y,0) + diceMod;
  const crits = rolls.filter(r=>r===sides).length;
  const label = rollLabel;
  lastRoll = {qty:diceQty, sides, mod:diceMod};    // remembered for "★ Save"
  diceRolling = true;
  const btn = $("dicePicker").querySelector(`[data-die="${sides}"]`);
  if(btn) btn.classList.add("rolling");
  $("dicePicker").classList.add("busy");
  const ticks = (typeof window!=="undefined" && window.__diceFast) ? [1,1,1] : DICE_TICKS;
  let i = 0;
  const finish = ()=>{
    renderDiceResult(sides, rolls, total, crits, label);
    diceLog.unshift({sides, rolls, total, mod:diceMod, crits, label});
    if(diceLog.length>24) diceLog.pop();
    renderDiceLog();
    if(btn) btn.classList.remove("rolling");
    $("dicePicker").classList.remove("busy");
    diceRolling = false;
    if(label){                                     // named rolls belong in the combat record
      const modTxt = diceMod ? ` ${diceMod>0?"+":"−"}${Math.abs(diceMod)}` : "";
      logit(`${esc(label)} — <b class="n">${total}</b> <span style="opacity:.7">(${diceQty}d${sides}${modTxt}: ${rolls.join(", ")})</span>`
            + (crits?" ✦ critical!":""), crits?"heal":"");
      save();
      if(S.view==="encounter") renderEncounter();
    }
    rollLabel = "";
    if(crits) fireCrit(crits, sides);              // payoff lands on the reveal
  };
  const tick = ()=>{
    if(i>=ticks.length){ finish(); return; }
    renderRolling(sides, rolls.map(()=>1+Math.floor(Math.random()*sides)), label);
    setTimeout(tick, ticks[i++]);
  };
  tick();
}
function labelLine(label){ return label ? `<div class="dr-label">${esc(label)}</div>` : ""; }
function renderRolling(sides, fake, label){
  const chips = fake.map(r=>`<span class="die-chip rolling">${r}</span>`).join("");
  const modTxt = diceMod ? ` ${diceMod>0?"+":"−"} ${Math.abs(diceMod)}` : "";
  $("diceResult").innerHTML = labelLine(label)
    + `<div class="dr-formula">${diceQty}d${sides}${modTxt}</div>`
    + `<div class="dr-dice">${chips}</div>`
    + `<div class="dr-total rolling-total"><span class="dr-t-lbl">Rolling…</span><span class="dr-t-val">?</span></div>`;
}
function renderDiceResult(sides, rolls, total, crits, label){
  const chips = rolls.map((r,i)=>`<span class="die-chip${r===sides?" crit":""}" style="animation-delay:${i*55}ms">${r}</span>`).join("");
  const modTxt = diceMod ? ` ${diceMod>0?"+":"−"} ${Math.abs(diceMod)}` : "";
  $("diceResult").innerHTML = labelLine(label)
    + `<div class="dr-formula">${diceQty}d${sides}${modTxt}</div>`
    + `<div class="dr-dice">${chips}</div>`
    + `<div class="dr-total${crits?" has-crit":""}"><span class="dr-t-lbl">Total</span><span class="dr-t-val">${total}</span>`
      + (crits?`<span class="dr-crit-tag">✦ ${crits>1?crits+"× ":""}Critical!</span>`:"")
      + `<button class="dr-save" data-saveroll="1" title="Save this roll as a favorite">★ Save</button></div>`;
}
function renderDiceLog(){
  $("diceLog").innerHTML = diceLog.length ? diceLog.map(e=>{
    const modTxt = e.mod ? ` ${e.mod>0?"+":"−"}${Math.abs(e.mod)}` : "";
    return `<div class="dl-row${e.crits?" crit":""}"><span class="dl-die">${e.rolls.length}d${e.sides}</span>`
      + `<span class="dl-rolls">${e.label?esc(e.label)+" · ":""}[${e.rolls.join(", ")}]${modTxt}</span>`
      + `<span class="dl-tot">${e.total}</span></div>`;
  }).join("") : `<div class="dl-row" style="justify-content:center; color:var(--muted)">no rolls yet</div>`;
}
function fireCrit(count, sides){
  const f = $("critFlash"); if(!f) return;
  f.innerHTML = `<div class="crit-ring"></div><div class="crit-ring r2"></div>`
    + `<div class="crit-word">${count>1?count+"× ":""}CRITICAL!<span class="crit-sub">max roll${sides?` on d${sides}`:""}</span></div>`;
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  const res = $("diceResult");
  if(res){ res.classList.remove("crit-shake"); void res.offsetWidth; res.classList.add("crit-shake"); setTimeout(()=>res.classList.remove("crit-shake"), 520); }
  clearTimeout(fireCrit._t); fireCrit._t = setTimeout(()=>f.classList.remove("go"), 920);
}

/* ---- rolls fired from a statblock ---- */
function parseDmg(str){
  const m = String(str||"").match(/(\d+)\s*d\s*(\d+)/i);
  if(!m) return null;
  const rest = String(str).slice(m.index + m[0].length);
  const mm = rest.match(/([+-])\s*(\d+)/);
  return { qty: clamp(+m[1],1,20), sides:+m[2], mod: mm ? (mm[1]==="-" ? -(+mm[2]) : +mm[2]) : 0 };
}
function rollNamed(qty, sides, modv, label){
  if(diceRolling){ toast("The dice are still in the air"); return; }
  diceQty = clamp(num(qty,1),1,20);
  diceMod = clamp(num(modv,0),-99,99);
  rollLabel = label || "";
  updateDiceOpts(); diceToggle(true);
  rollDice(sides);
}

/* ---- saved rolls (favourite attacks / spells) ---- */
const rollFormula = r => `${r.qty}d${r.sides}${r.mod>0?"+"+r.mod:r.mod<0?r.mod:""}`;
function renderSavedRolls(){
  const list = $("diceSavedList"); if(!list) return;
  const rolls = S.savedRolls || [];
  list.innerHTML = rolls.length ? rolls.map(r=>
    `<div class="ds-chip"><button class="ds-roll" data-rollsaved="${r.id}" title="Roll ${rollFormula(r)}"><span class="dsc-name">${esc(r.name)}</span><span class="dsc-formula">${rollFormula(r)}</span></button><button class="ds-del" data-delsaved="${r.id}" title="Remove ${esc(r.name)}">✕</button></div>`
  ).join("") : `<div class="ds-empty">Roll something, then ★ Save it as a favorite.</div>`;
}
function openSaveForm(){
  if(!lastRoll){ toast("Roll something first, then save it"); return; }
  const form = $("diceSaveForm"), inp = $("diceSaveName");
  form.hidden = false; inp.value = ""; inp.placeholder = `Name this ${rollFormula(lastRoll)} roll…`; inp.focus();
}
function closeSaveForm(){ const f = $("diceSaveForm"); if(f) f.hidden = true; }
function commitSavedRoll(){
  if(!lastRoll) return;
  const name = ($("diceSaveName").value||"").trim() || rollFormula(lastRoll);
  S.savedRolls = S.savedRolls || [];
  S.savedRolls.push({id:uid(), name, qty:lastRoll.qty, sides:lastRoll.sides, mod:lastRoll.mod});
  save(); renderSavedRolls(); closeSaveForm();
  toast(`Saved "${name}" (${rollFormula(lastRoll)})`);
}
function deleteSavedRoll(id){ S.savedRolls = (S.savedRolls||[]).filter(r=>r.id!==id); save(); renderSavedRolls(); }
function rollSaved(id){
  const r = (S.savedRolls||[]).find(x=>x.id===id); if(!r || diceRolling) return;
  diceQty = r.qty; diceMod = r.mod; rollLabel = r.name; updateDiceOpts();
  rollDice(r.sides);
}
function wireDice(){
  updateDiceOpts(); renderDiceLog(); renderSavedRolls();
  $("diceFab").addEventListener("click", ()=>diceToggle());
  $("diceClose").addEventListener("click", ()=>diceToggle(false));
  $("diceOverlay").addEventListener("click", ()=>diceToggle(false));
  $("diceTray").addEventListener("click", e=>{
    const rs = e.target.closest("[data-rollsaved]"); if(rs){ rollSaved(rs.dataset.rollsaved); return; }
    const del = e.target.closest("[data-delsaved]"); if(del){ deleteSavedRoll(del.dataset.delsaved); return; }
    if(e.target.closest("[data-saveroll]")){ openSaveForm(); return; }
    if(e.target.id==="diceSaveConfirm"){ commitSavedRoll(); return; }
    if(e.target.id==="diceSaveCancel"){ closeSaveForm(); return; }
    const q = e.target.closest("[data-diceqty]"); if(q){ if(diceRolling) return; diceQty = clamp(diceQty + (+q.dataset.diceqty),1,20); updateDiceOpts(); return; }
    const m = e.target.closest("[data-dicemod]"); if(m){ if(diceRolling) return; diceMod = clamp(diceMod + (+m.dataset.dicemod),-20,20); updateDiceOpts(); return; }
    const dd = e.target.closest("[data-die]"); if(dd){ rollDice(+dd.dataset.die); return; }
    if(e.target.id==="diceLogClear"){ diceLog = []; renderDiceLog(); return; }
  });
  $("diceTray").addEventListener("keydown", e=>{
    if(e.target.id==="diceSaveName"){
      if(e.key==="Enter"){ e.preventDefault(); commitSavedRoll(); }
      else if(e.key==="Escape"){ e.preventDefault(); closeSaveForm(); }
    }
  });
  document.addEventListener("keydown", e=>{
    const tag = (e.target && e.target.tagName) || "";
    if(tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT" || (e.target && e.target.isContentEditable)) return;
    if(e.key==="r" || e.key==="R") diceToggle(true);
    else if(e.key==="Escape" && diceOpen) diceToggle(false);
  });
}

/* ============================================================
   Attack resolution — Decide Your Own Path house rule
   ------------------------------------------------------------
   There is no separate to-hit roll. You roll the weapon's damage;
   any die that comes up its own maximum is a critical and is rolled
   again, chaining for as long as it keeps maxing. Flat bonuses
   (attribute, +1/+2/+3 magic) are added to that total, and the
   target's Armor Class is subtracted from it. Whatever is left is
   the damage. Extra dice riding on the weapon — a flametongue's
   fire, say — are rolled only once the blow has landed, and they
   do not explode.
   ============================================================ */
const EXPLODE_CAP = 30;                 // paranoia guard, never reached in play

function explodeDie(sides){
  if(sides < 2) return [rollDie(Math.max(1,sides))];
  const chain = []; let v;
  do { v = rollDie(sides); chain.push(v); } while(v === sides && chain.length < EXPLODE_CAP);
  return chain;
}
function rollExploding(qty, sides){
  const out = [];
  for(let i=0;i<clamp(num(qty,1),1,40);i++) out.push(explodeDie(sides));
  return out;
}
const chainSum = ch => ch.reduce((a,b)=>a+b,0);

/* "1d6 fire", "2d4 +1 necrotic" → {qty, sides, mod, type} */
function parseRider(str){
  const p = parseDmg(str);
  if(!p) return null;
  const type = (String(str||"").match(/([A-Za-z]{3,})\s*$/)||[])[1] || "";
  return {qty:p.qty, sides:p.sides, mod:p.mod, type: /^d\d+$/i.test(type) ? "" : type};
}

function isCharmed(c){ return (c.cond||[]).some(x=>/charm/i.test(x.n)); }

/* Who a creature may swing at: the other side, plus its own once it is charmed. */
function eligibleTargets(attacker){
  const foeSide = attacker.side === "foe";
  let sides = foeSide ? ["pc","ally"] : ["foe"];
  const charmed = isCharmed(attacker);
  if(charmed) sides = sides.concat(foeSide ? ["foe"] : ["pc","ally"]);
  return S.cs.filter(c => c.id !== attacker.id && sides.indexOf(c.side) > -1)
             .map(c => ({c, turned: charmed && (foeSide ? c.side==="foe" : c.side!=="foe")}));
}

function resolveAttack(){
  const st = ui.atk; if(!st) return;
  const c = byId(st.cid); if(!c) return;
  const a = (c.blk && c.blk.atk) ? c.blk.atk[st.ai] : null; if(!a) return;
  const dice = parseDmg(a.d);
  if(!dice){ toast(`${a.n} has no damage dice to roll`, "err"); return; }

  const chains = rollExploding(dice.qty, dice.sides);
  const base   = chains.reduce((s,ch)=>s+chainSum(ch), 0);
  const bonus  = num(st.bonus, 0);
  const total  = base + bonus;
  const crits  = chains.filter(ch=>ch.length>1).length;
  const deepest= chains.reduce((m,ch)=>Math.max(m,ch.length),1);

  const tgt = st.target ? byId(st.target) : null;
  let ac = null, dealt = null, hit = null, rider = null;
  if(tgt){
    ac = tgt.ac;
    const through = total - ac;
    hit = through >= 1;
    dealt = Math.max(0, through);
    if(hit){
      const r = parseRider(st.rider);
      if(r){
        const rolls = []; for(let i=0;i<clamp(r.qty,1,40);i++) rolls.push(rollDie(r.sides));
        const sum = rolls.reduce((x,y)=>x+y,0) + r.mod;
        rider = {rolls, mod:r.mod, sum, sides:r.sides, type:r.type};
        dealt += sum;
      }
    }
  }
  st.result = {chains, base, bonus, total, crits, deepest, sides:dice.sides, qty:dice.qty,
               targetId: tgt?tgt.id:null, targetName: tgt?tgt.name:"", ac, hit, dealt, rider, applied:false};

  /* the roller's history keeps one line for every attack too */
  diceLog.unshift({sides:dice.sides, rolls:chains.map(chainSum), total, mod:bonus, crits,
                   label:`${c.name} — ${a.n}`});
  if(diceLog.length>24) diceLog.pop();
  if($("diceLog")) renderDiceLog();

  const chainTxt = chains.map(ch=>ch.length>1?ch.join("→"):String(ch[0])).join(", ");
  const bTxt = bonus ? ` ${bonus>0?"+":"−"}${Math.abs(bonus)}` : "";
  let line = `<b>${esc(c.name)}</b> attacks with ${esc(a.n)} — [${chainTxt}]${bTxt} = <b class="n">${total}</b>`;
  if(tgt){
    line += ` vs ${esc(tgt.name)}'s AC ${ac} → `;
    line += hit ? `<b class="n">${dealt}</b> damage${rider?` (incl. ${rider.sum} ${esc(rider.type||"extra")})`:""}.`
                : `turned aside.`;
  }else line += ` (no target).`;
  if(crits) line += ` ✦ ${crits>1?crits+"× ":""}critical!`;
  logit(line, hit===false ? "" : "dmg");

  if(deepest >= 3) fireCrit(deepest-1, dice.sides);   // a chain of three is worth the fanfare
  renderAll();
}
function applyAttack(){
  const st = ui.atk; if(!st || !st.result || st.result.applied) return;
  const r = st.result;
  if(!r.targetId || !r.hit || !r.dealt){ toast("Nothing to apply"); return; }
  damage(r.targetId, r.dealt);
  r.applied = true;
  renderAll();
  toast(`${r.dealt} damage to ${r.targetName}`);
}
function openAtkPanel(cid, ai){
  const c = byId(cid); if(!c) return;
  const a = (c.blk && c.blk.atk) ? c.blk.atk[ai] : null; if(!a) return;
  if(ui.atk && ui.atk.cid===cid && ui.atk.ai===ai){ ui.atk = null; renderAll(); return; }
  const dice = parseDmg(a.d);
  const foes = eligibleTargets(c);
  ui.atk = { cid, ai, target: foes.length===1 ? foes[0].c.id : null,
             bonus: dice ? dice.mod : 0, rider: c.bonusDice || "", result:null };
  ui.open[cid] = true;
  renderAll();
}
function atkPanelHTML(c, a, ai){
  const st = ui.atk;
  if(!st || st.cid!==c.id || st.ai!==ai) return "";
  const dice = parseDmg(a.d);
  const list = eligibleTargets(c);
  const charmed = isCharmed(c);

  const chips = list.length
    ? list.map(({c:t,turned})=>
      `<button class="tgt${st.target===t.id?" on":""}${isDown(t)?" dead":""}${turned?" charm":""}" data-atktgt="${t.id}" title="${esc(t.name)} — AC ${t.ac}${turned?" · in reach only because the attacker is charmed":""}">
         <span class="tg">${esc(t.g)}</span><span class="tn">${esc(t.name)}</span><span class="tac">AC ${t.ac}</span>
       </button>`).join("")
      + `<button class="tgt${st.target?"":" on"}" data-atktgt="" title="Roll the damage without subtracting anyone's Armor Class"><span class="tn tgt-none">no target</span></button>`
    : `<span class="tgt-none">Nothing on the field for it to swing at.</span>`;

  let out = "";
  const r = st.result;
  if(r){
    const chainsHTML = r.chains.map(ch=>{
      const dice = ch.map((v,i)=>`<span class="cd${v===r.sides?" boom":""}" style="animation-delay:${i*60}ms">${v}</span>`).join(`<span class="plus">+</span>`);
      return `<span class="chain">${dice}${ch.length>1?`<span class="csum">=${chainSum(ch)}</span>`:""}</span>`;
    }).join("");
    const riderHTML = r.rider
      ? `<span class="chain rider">` + r.rider.rolls.map((v,i)=>`<span class="cd" style="animation-delay:${(i+1)*60}ms">${v}</span>`).join(`<span class="plus">+</span>`)
        + (r.rider.mod?`<span class="plus">${r.rider.mod>0?"+":"−"}${Math.abs(r.rider.mod)}</span>`:"")
        + `<span class="csum">=${r.rider.sum} ${esc(r.rider.type||"extra")}</span></span>`
      : "";
    const bTxt = r.bonus ? ` ${r.bonus>0?"+":"−"} ${Math.abs(r.bonus)}` : "";
    let math = `<div class="ap-math">${r.qty}d${r.sides} → <b>${r.base}</b>${bTxt?` bonus${bTxt}`:""} = <b>${r.total}</b>`;
    if(r.ac!=null){
      math += `<br>${r.total} − AC ${r.ac} = <b>${r.total - r.ac}</b>`;
      if(r.hit && r.rider) math += ` &nbsp;+&nbsp; ${r.rider.sum} ${esc(r.rider.type||"extra")} on the hit = <b>${r.dealt}</b>`;
    }else{
      math += `<br><span>no target chosen — pick one to subtract its Armor Class</span>`;
    }
    math += `</div>`;

    const verdict = r.ac==null
      ? `<div class="ap-verdict"><div class="ap-dmg">${r.total}<small>rolled</small></div>${r.crits?`<span class="ap-tag crit">✦ ${r.crits>1?r.crits+"× ":""}critical</span>`:""}</div>`
      : `<div class="ap-verdict">
           <div class="ap-dmg${r.hit?"":" miss"}">${r.hit?r.dealt:"turned aside"}${r.hit?`<small>damage to ${esc(r.targetName)}</small>`:`<small>AC ${r.ac} held</small>`}</div>
           <span class="ap-tag ${r.hit?"hit":"miss"}">${r.hit?"hit":"no damage"}</span>
           ${r.crits?`<span class="ap-tag crit">✦ ${r.crits>1?r.crits+"× ":""}critical</span>`:""}
           ${r.hit?`<button class="ap-apply${r.applied?" done":""}" data-atkapply="1">${r.applied?"applied ✓":`Apply ${r.dealt} to ${esc(r.targetName)}`}</button>`:""}
         </div>`;

    out = `<div class="ap-out"><div class="ap-chains">${chainsHTML}${riderHTML}</div>${math}${verdict}</div>`;
  }

  return `<div class="atk-panel">
    <span class="ap-lbl">Target${charmed?` <span class="hint">charmed — it may turn on its own side</span>`:``}</span>
    <div class="tgt-grid">${chips}</div>
    <div class="ap-fields">
      <div class="ap-f bonus"><span class="ap-lbl" style="margin:0">Bonus</span>
        <input data-atkbonus="1" value="${st.bonus}" inputmode="numeric" title="Attribute and flat magic bonus added to the damage total"></div>
      <div class="ap-f rider"><span class="ap-lbl" style="margin:0">Dice on a hit</span>
        <input data-atkrider="1" value="${esc(st.rider)}" placeholder="e.g. 1d6 fire" title="Extra dice rolled only if the blow lands"></div>
      <button class="ap-close" data-atkclose="1">Close</button>
      <button class="ap-roll" data-atkroll="1">${r?"Roll again":`Roll ${dice?`${dice.qty}d${dice.sides}`:"attack"}`}</button>
    </div>
    ${out}
  </div>`;
}

/* boot */
load(); renderAll(); wire(); wireDice();

/* test hooks */
window.__fray = { get S(){return S;}, get ui(){return ui;}, renderAll, displayOrder, byId,
                  rollDice, rollNamed, rollSaved, parseDmg, parseRider, diceToggle, commitSavedRoll,
                  explodeDie, rollExploding, eligibleTargets, resolveAttack, applyAttack, openAtkPanel, isCharmed,
                  get diceLog(){return diceLog;}, get diceOpen(){return diceOpen;}, get lastRoll(){return lastRoll;}, damage, heal, grantTemp,
                  startEncounter, nextTurn, prevTurn, endEncounter, addTemplate, addCustom, sortCs,
                  charDerived, importCharacter, BESTIARY, hydrate, blank };
})();
</script>
</body>
